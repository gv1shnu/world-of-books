# Render's free web service sleeps after 15 minutes without traffic, and the
# first visitor then waits about a minute. Pinging it every 10 minutes keeps it
# awake; one always-on service fits inside Render's 750 free hours a month.
# GitHub may delay scheduled runs, and pauses them after 60 days without
# repository activity.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: ${{ vars.NEXT_PUBLIC_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: >-
          curl -sS -o /dev/null -w "API answered %{http_code}\n"
          --retry 2 --retry-delay 20 --retry-all-errors --max-time 90
          "${{ vars.NEXT_PUBLIC_API_URL }}/categories/navigations"
